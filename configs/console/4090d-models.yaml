    manifest: /root/autodl-tmp/hqsb/models/manifests/llama3.2-3b.sha256
    manifest_allow_extra: [.msc, .mv]
    attention: sdpa
  - id: qwen3-06b
    name: Alibaba · Qwen3 0.6B
    platform: CUDA / RTX 4090 D
    model: Qwen/Qwen3-0.6B
    model_path: /root/autodl-tmp/hqsb/models/qwen3-0.6b
