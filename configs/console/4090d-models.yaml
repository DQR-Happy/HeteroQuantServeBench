# Target-specific paths. Download/verify via download_catalog_modelscope.py first.
# One resident model at a time; the console drains the previous model on switch.
deployments:
  - id: qwen-reference
    name: Qwen3 · 1.7B · HQSB 算子基线
    provider: pytorch
    platform: CUDA / RTX 4090 D
    model: Qwen/Qwen3-1.7B
    model_path: ~/models/hqsb/Qwen3-1.7B
    manifest: docs/benchmark/model_sha256_manifest.txt
    kernel_manifest: build/l2/model-kernels.json
    attention: eager
    context_limit: 2048
    max_output_tokens: 512
  - id: gemma3-1b
    name: Google · Gemma 3 1B IT
    platform: CUDA / RTX 4090 D
    model: google/gemma-3-1b-it
    model_path: /root/autodl-tmp/hqsb/models/gemma3-1b
    manifest: /root/autodl-tmp/hqsb/models/manifests/gemma3-1b.sha256
    manifest_allow_extra: [.msc, .mv]
    attention: sdpa
  - id: llama32-1b
    name: Meta · Llama 3.2 1B Instruct
    platform: CUDA / RTX 4090 D
    model: LLM-Research/Llama-3.2-1B-Instruct
    model_path: /root/autodl-tmp/hqsb/models/llama3.2-1b
    manifest: /root/autodl-tmp/hqsb/models/manifests/llama3.2-1b.sha256
    manifest_allow_extra: [.msc, .mv]
    attention: sdpa
