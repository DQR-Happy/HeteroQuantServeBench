# GENERATED by scripts/experimental/gen_experimental_specs.py — do not edit by hand.
# 冻结词汇表：不含任何测量值；实测结果一律落在 artifacts/S14/ 下。
kind: adoption-rules
version: v1
sources:
- docs/stage_experiments/README.md
- docs/stage_experiments/details/S14/E14-05_frontier_adr_hypothesis_preregistration.md
- docs/stage_experiments/details/S14/README.md
note: 采用是多目标决策；不允许事后把某个指标变好当作成功
rules:
- decision: ADOPT_CORE
  requires: 通过 S13/S15 回归，maturity=ADOPTED_CORE
- decision: ADOPT_EXPERIMENTAL
  requires: 质量门通过且收益限定于预注册 workload
- decision: RESEARCH_ONLY
  requires: 机制可解释但工程代价或适用域过窄
- decision: REJECT_NO_BENEFIT
  requires: 门禁完整且收益无法覆盖成本（需 raw 证据）
- decision: REJECT_QUALITY
  requires: 质量门失败（优先于任何性能结论）
- decision: REJECT_COMPLEXITY
  requires: 维护/依赖/升级成本超出采用预算
- decision: REJECT_PORTABILITY
  requires: 仅特定硬件/shape 可用且不可迁移
- decision: BLOCKED_EVIDENCE
  requires: 证据不足，不得写成负结论
- decision: N/A_BY_ADR
  requires: 阶段范围经 ADR 正式缩减，并同步缩小能力声明
outcomes:
  quality_fail: REJECT_QUALITY
  no_benefit: REJECT_NO_BENEFIT
  benefit_specific_workload_only: ADOPT_EXPERIMENTAL
  not_portable: REJECT_PORTABILITY
  engineering_cost_too_high: REJECT_COMPLEXITY
  benefit_confirmed: ADOPT_EXPERIMENTAL
