name: CPU CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core package (CPU-only, no hardware deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,benchmark]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run CPU unit + property tests
        run: |
          pytest -m "not hardware and not e2e and not performance" -q

#      - name: Lint with ruff
#        run: |
#          ruff check hqsb tests

#      - name: Type check with mypy
#        run: |
#          mypy hqsb/core
