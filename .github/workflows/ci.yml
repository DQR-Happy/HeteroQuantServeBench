name: CPU CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core, benchmark and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,benchmark]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run CPU unit + property tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          CUDA_VISIBLE_DEVICES: ""
        run: |
          pytest -m "not hardware and not e2e and not performance" -q

      - name: Import dependency architecture gate (E01-05)
        run: |
          python scripts/audit/import_dependency_gate.py

      - name: Lint Python source and runners
        run: ruff check hqsb ops scripts tests benchmarks

      - name: Check public documentation links
        run: python scripts/check_docs.py

#      - name: Type check with mypy
#        run: |
#          mypy hqsb/core
