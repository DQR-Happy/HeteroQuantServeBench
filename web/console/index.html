<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef0f2" />
    <meta
      name="description"
      content="HQSB 异构推理与优化工作台：真实推理、资源观测、实验对比与证据追溯。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>HQSB · 推理观测工作台</title>
  </head>
  <body>
    <div id="root">
      <main
        style="
          max-width: 660px;
          margin: 12vh auto;
          padding: 28px;
          font:
            15px/1.7 -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            sans-serif;
          color: #20262e;
        "
      >
        <p style="color: #586372">HQSB · 推理观测工作台</p>
        <h1 style="font-size: 24px">正在加载工作台</h1>
        <p id="entry-description">
          如果此提示持续显示，前端模块可能未加载。请检查服务地址或重新构建前端。
        </p>
        <p>完整系统由 Jetson 上的 Console 服务提供。源码入口和构建入口均需通过 HTTP 访问。</p>
        <p><a href="http://127.0.0.1:8765">默认服务地址（需先启动服务与 SSH 转发）</a></p>
        <p id="offline-preview" hidden>
          <a id="preview-link" href="./public/preview.html">打开可双击查看的离线界面预览</a> ·
          只读截图，不连接后端
        </p>
        <noscript><p>浏览器已禁用 JavaScript；真实工作台需要启用 JavaScript。</p></noscript>
      </main>
    </div>
    <script>
      if (location.protocol === 'file:') {
        document.querySelector('#root h1').textContent = '此入口不能作为独立 HTML 运行';
        document.getElementById('entry-description').textContent =
          '你正在直接打开本地文件。浏览器不会编译 TSX，也无法通过文件协议连接同源 API。请使用服务地址，或打开下方离线预览。';
        document.getElementById('offline-preview').hidden = false;
        if (location.pathname.endsWith('/dist/index.html')) {
          document.getElementById('preview-link').href = './preview.html';
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
